[package]
name = "mqtt-zapp-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
toml = "0.8"
directories = "5"
rand = "0.8"
anyhow = "1"
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }
# `use-rustls-no-provider`: rumqttc's `use-rustls` would turn on tokio-rustls'
# default aws-lc-rs provider. We stay on ring (no C/cmake toolchain, easy musl
# build) and select it explicitly in `tls_config`.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
rustls-native-certs = "0.8"
regex = "1"

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[package]
name = "mqtt-zapp-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
toml = "0.8"
directories = "5"
rand = "0.8"
anyhow = "1"
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"

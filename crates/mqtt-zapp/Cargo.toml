[package]
name = "mqtt-zapp"
version.workspace = true
edition.workspace = true

[dependencies]
mqtt-zapp-core = { path = "../mqtt-zapp-core", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["keyring"]
keyring = ["mqtt-zapp-core/keyring"]

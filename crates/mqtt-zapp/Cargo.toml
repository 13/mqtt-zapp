[package]
name = "mqtt-zapp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal MQTT explorer: browse topics, watch, diff, chart and publish"
repository = "https://github.com/13/mqtt-zapp"
readme = "../../README.md"

[dependencies]
mqtt-zapp-core = { path = "../mqtt-zapp-core", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rpassword = "7"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.42.0"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[features]
default = ["keyring"]
keyring = ["mqtt-zapp-core/keyring"]

[package.metadata.deb]
maintainer = "13 <13@users.noreply.github.com>"
copyright = "2026, mqtt-zapp contributors"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto"
extended-description = """\
A terminal MQTT explorer: browse a broker's topic tree, watch payloads update
live, diff against the previous message, chart numeric fields and publish."""
assets = [
    ["target/release/mqtt-zapp", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/mqtt-zapp/README.md", "644"],
]

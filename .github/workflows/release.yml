name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mqtt-zapp --no-default-features
      - name: Verify static binary
        run: file target/x86_64-unknown-linux-musl/release/mqtt-zapp | grep -Eq 'static(-pie)? linked|statically linked'
      - name: Package
        run: |
          strip target/x86_64-unknown-linux-musl/release/mqtt-zapp
          cp target/x86_64-unknown-linux-musl/release/mqtt-zapp "mqtt-zapp-${GITHUB_REF_NAME//\//-}-x86_64-linux-musl"
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "mqtt-zapp-${GITHUB_REF_NAME}-x86_64-linux-musl" --generate-notes

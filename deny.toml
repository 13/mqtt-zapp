[advisories]
# Defaults: vulnerabilities deny, unmaintained warn.
ignore = [
  # rumqttc 0.25.1 (latest) still depends on rustls-webpki 0.102.8, which has
  # no fixed 0.102.x release. It uses that crate only for an error-enum variant
  # (`TlsError::WebPki`) and never calls into it; certificate verification runs
  # on rustls 0.23's rustls-webpki 0.103.x, which has the fixes. Drop these when
  # rumqttc moves off 0.102.
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 via rumqttc 0.25.1: linked but never called; verification uses 0.103.x" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8 via rumqttc 0.25.1: linked but never called; verification uses 0.103.x" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8 via rumqttc 0.25.1: linked but never called; verification uses 0.103.x" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8 via rumqttc 0.25.1: linked but never called; verification uses 0.103.x" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 via rumqttc 0.25.1: linked but never called; verification uses 0.103.x" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; mqtt-zapp-core no longer uses it, only rumqttc 0.25.1's TlsConfiguration::Simple path does, which we never take (we pass TlsConfiguration::Rustls)" },
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained (proc-macro, build time only); pulled in by ratatui 0.29. Goes away with a ratatui upgrade" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  # async_io_stream, pharos, ws_stream_tungstenite (rumqttc websocket deps)
  "Unlicense",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
